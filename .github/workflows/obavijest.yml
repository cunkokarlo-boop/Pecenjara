name: Obavijest o promjeni (issue #1)

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  komentar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ISSUE = 1;  // tema "Pečenjara – promjene i komentari"
            const repo = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commits = context.payload.commits || [];
            if (!commits.length) return;
            const datoteke = new Set();
            const redovi = commits.map(c => {
              [...c.added, ...c.modified, ...c.removed].forEach(f => datoteke.add(f));
              const naslov = c.message.split('\n')[0];
              return `- [${c.id.slice(0, 7)}](${c.url}) ${naslov}`;
            });
            const pop = [...datoteke].sort().map(f => `\`${f}\``).join(', ');
            const dxf = [...datoteke].some(f => f.startsWith('dxf/') && !f.startsWith('dxf/izlaz/'));
            let body = `### Promjena ${new Date().toLocaleString('hr-HR', { timeZone: 'Europe/Zagreb' })}\n\n${redovi.join('\n')}\n\n**Datoteke:** ${pop}\n\n[Pogledaj razlike](${context.payload.compare})`;
            if (dxf) body += ` · [Novi pregled dijelova](${repo}/blob/main/dxf/izlaz/00_PREGLED.png) (osvježi se za ~1 min)`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: ISSUE, body });
